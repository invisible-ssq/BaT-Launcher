name: Build BaT Launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BaTLauncher-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BaTLauncher-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          tag_name: v1.0.0
          name: "BaT Launcher v1.0.0"
          body: |
            ## BaT Launcher v1.0.0
            
            ### Фичи:
            - Microsoft аккаунты (OAuth2 + Xbox Live)
            - Ely.by аккаунты
            - Локальные аккаунты (офлайн)
            - Менеджер аккаунтов
            - Автозагрузка Fabric 1.21.4
            - Автозагрузка BaTVisuals мода
            - Запуск Minecraft прямо в приложении
            
            ### Установка:
            1. Скачай APK
            2. Установи
            3. Запусти → скачай игру (кнопка ⬇)
            4. Добавь аккаунт
            5. Играй!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
